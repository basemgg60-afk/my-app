name: Build EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download NW.js
      run: |
        curl -L -o nw.zip https://dl.nwjs.io/v0.48.0/nwjs-v0.48.0-win-ia32.zip
        Expand-Archive -Path nw.zip -DestinationPath nwjs
    
    - name: Copy app files
      run: |
        mkdir app
        copy index.html app\
        copy package.json app\
        if exist *.css copy *.css app\
        if exist *.js copy *.js app\
    
    - name: Copy NW.js files (with all folders)
      run: |
        xcopy /E /I nwjs\nwjs-v0.48.0-win-ia32 app\
    
    - name: Upload all files
      uses: actions/upload-artifact@v4
      with:
        name: myapp
        path: app/
